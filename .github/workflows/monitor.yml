name: Alertas de concertos

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-concertos
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o monitor
        uses: actions/checkout@v4

      - name: Verificar agendas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_concertos.py

      - name: Guardar os eventos já vistos
        run: |
          git config user.name "Monitor de Concertos"
          git config user.email "actions@users.noreply.github.com"
          git add eventos_oficiais_vistos.json
          git diff --cached --quiet || git commit -m "Atualizar eventos vistos"
          git push
